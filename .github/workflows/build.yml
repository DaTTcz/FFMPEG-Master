name: Build binaries

# Při KAŽDÉM pushnutí do main (nebo ručním spuštění bez tagu) proběhne jen rychlá
# kontrola "quick-check" - nainstalují se závislosti a skript se zkompiluje
# (python -m py_compile). Odhalí to syntax chyby i rozbité/chybějící závislosti
# v requirements.txt, ale netrvá to minuty jako celý PyInstaller build.
#
# Skutečný build (build-windows/build-linux) a GitHub Release (release) se spustí
# jen při pushnutí tagu ve tvaru "v*" (např. v0.7, v0.7.1) - k tomu tagu se pak přiloží
# Windows .exe, univerzální Linux AppImage (běží na jakékoliv distribuci) a Linux .deb
# (pohodlná instalace se správnou registrací do menu na Debian/Ubuntu odvozených distro,
# ale bez auto-update uvnitř appky - viz linux_run_mode()=="deb" v hlavním skriptu).

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quick-check:
    if: "!startsWith(github.ref, 'refs/tags/v')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Systémové závislosti pro Tkinter/Tk
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Najdi aktuální hlavní skript
        id: main
        run: |
          FILE=$(ls FFMPEG_Master_v*.pyw | sort -V | tail -n1)
          echo "Hlavní skript: $FILE"
          echo "script=$FILE" >> "$GITHUB_OUTPUT"

      - name: Zkompiluj skript (syntax + rychlá kontrola)
        run: python -m py_compile "${{ steps.main.outputs.script }}"

  build-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Najdi aktuální hlavní skript
        id: main
        shell: bash
        run: |
          FILE=$(ls FFMPEG_Master_v*.pyw | sort -V | tail -n1)
          echo "Hlavní skript: $FILE"
          echo "script=$FILE" >> "$GITHUB_OUTPUT"

      - name: Build (PyInstaller)
        shell: bash
        run: |
          pyinstaller --noconfirm --onefile --windowed \
            --name FFMPEG_Master \
            --icon favicon.ico \
            --add-data "favicon.ico;." \
            --add-data "favicon.png;." \
            --collect-all tkinterdnd2 \
            --collect-all customtkinter \
            --hidden-import PIL._tkinter_finder \
            "${{ steps.main.outputs.script }}"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/FFMPEG_Master.exe

  build-linux:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Systémové závislosti pro Tkinter/Tk a AppImage
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk-dev file

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Najdi aktuální hlavní skript
        id: main
        run: |
          FILE=$(ls FFMPEG_Master_v*.pyw | sort -V | tail -n1)
          echo "Hlavní skript: $FILE"
          echo "script=$FILE" >> "$GITHUB_OUTPUT"

      - name: Build (PyInstaller)
        run: |
          pyinstaller --noconfirm --onefile --windowed \
            --name ffmpeg-master \
            --add-data "favicon.ico:." \
            --add-data "favicon.png:." \
            --collect-all tkinterdnd2 \
            --collect-all customtkinter \
            --hidden-import PIL._tkinter_finder \
            "${{ steps.main.outputs.script }}"
          chmod +x dist/ffmpeg-master

      - name: Připrav sdílený .desktop soubor
        run: |
          cat > ffmpeg-master.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=FFMPEG Master
          Comment=Davkovy konvertor videa pres FFmpeg
          Exec=ffmpeg-master
          Icon=ffmpeg-master
          Terminal=false
          Categories=AudioVideo;Video;
          EOF

      - name: Sestav .deb balíček (pohodlná instalace na Debian/Ubuntu odvozené distribuce)
        run: |
          VERSION_NUM="${GITHUB_REF_NAME#v}"
          PKG_DIR="ffmpeg-master_${VERSION_NUM}_amd64"
          mkdir -p "$PKG_DIR/DEBIAN" "$PKG_DIR/usr/bin" "$PKG_DIR/usr/share/applications" "$PKG_DIR/usr/share/icons/hicolor/256x256/apps"

          cp dist/ffmpeg-master "$PKG_DIR/usr/bin/ffmpeg-master"
          chmod 755 "$PKG_DIR/usr/bin/ffmpeg-master"
          cp favicon.png "$PKG_DIR/usr/share/icons/hicolor/256x256/apps/ffmpeg-master.png"
          cp ffmpeg-master.desktop "$PKG_DIR/usr/share/applications/ffmpeg-master.desktop"

          cat > "$PKG_DIR/DEBIAN/control" << EOF
          Package: ffmpeg-master
          Version: ${VERSION_NUM}
          Section: video
          Priority: optional
          Architecture: amd64
          Maintainer: DaTT.cz <info@datt.cz>
          Description: Davkovy konvertor videa pres FFmpeg
           GUI nastroj pro davkove prekodovani videa pomoci FFmpeg/NVENC.
          EOF

          cat > "$PKG_DIR/DEBIAN/postinst" << 'EOF'
          #!/bin/sh
          set -e
          if command -v update-desktop-database >/dev/null 2>&1; then
              update-desktop-database /usr/share/applications || true
          fi
          if command -v gtk-update-icon-cache >/dev/null 2>&1; then
              gtk-update-icon-cache -f /usr/share/icons/hicolor || true
          fi
          exit 0
          EOF
          chmod 755 "$PKG_DIR/DEBIAN/postinst"

          cat > "$PKG_DIR/DEBIAN/postrm" << 'EOF'
          #!/bin/sh
          set -e
          if command -v update-desktop-database >/dev/null 2>&1; then
              update-desktop-database /usr/share/applications || true
          fi
          exit 0
          EOF
          chmod 755 "$PKG_DIR/DEBIAN/postrm"

          dpkg-deb --build --root-owner-group "$PKG_DIR" "FFMPEG_Master_${VERSION_NUM}_amd64.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: FFMPEG_Master_*_amd64.deb

      - name: Sestav AppImage (univerzální - běží na jakékoliv distribuci)
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp dist/ffmpeg-master AppDir/usr/bin/ffmpeg-master
          cp favicon.png AppDir/usr/share/icons/hicolor/256x256/apps/ffmpeg-master.png
          cp favicon.png AppDir/ffmpeg-master.png
          cp ffmpeg-master.desktop AppDir/usr/share/applications/ffmpeg-master.desktop
          cp ffmpeg-master.desktop AppDir/ffmpeg-master.desktop
          cat > AppDir/AppRun << 'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/ffmpeg-master" "$@"
          EOF
          chmod +x AppDir/AppRun

          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool.AppImage
          chmod +x appimagetool.AppImage
          # Rozbal a spusť appimagetool ručně místo přímého spuštění - runner nemusí mít FUSE.
          ./appimagetool.AppImage --appimage-extract
          ARCH=x86_64 ./squashfs-root/AppRun AppDir FFMPEG_Master-x86_64.AppImage
          chmod +x FFMPEG_Master-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: FFMPEG_Master-x86_64.AppImage

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: dist-windows

      - uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: dist-linux-appimage

      - uses: actions/download-artifact@v4
        with:
          name: linux-deb
          path: dist-linux-deb

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-windows/FFMPEG_Master.exe
            dist-linux-appimage/FFMPEG_Master-x86_64.AppImage
            dist-linux-deb/*.deb
