name: Build binaries

# Tři úrovně podle toho, co workflow spustí:
#
# - push do main -> jen rychlá kontrola "quick-check": nainstalují se závislosti, skript se
#   zkompiluje a proběhne `--selftest` (bez GUI) proti ffmpeg z Ubuntu. Pár desítek vteřin.
#
# - ruční spuštění (Actions -> Build binaries -> Run workflow) -> quick-check + plný build
#   všech balíčků + test na distribucích, ale BEZ vydání releasu. Na vyzkoušení změn v buildu.
#
# - push tagu "v*" (např. v0.7.4) -> plný build + test na distribucích + GitHub Release se čtyřmi
#   soubory: Windows .exe, univerzální Linux AppImage, .deb (Debian/Ubuntu/Mint) a .rpm (Fedora/
#   openSUSE). Release vznikne jen tehdy, když všechny testy projdou. Tag musí odpovídat
#   VERSION v hlavním skriptu, jinak build skončí chybou.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quick-check:
    if: "!startsWith(github.ref, 'refs/tags/v')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Systémové závislosti pro Tkinter/Tk a ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk-dev ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Najdi aktuální hlavní skript
        id: main
        run: |
          FILE=$(ls FFMPEG_Master_v*.pyw | sort -V | tail -n1)
          echo "Hlavní skript: $FILE"
          echo "script=$FILE" >> "$GITHUB_OUTPUT"

      - name: Zkompiluj skript (syntax + rychlá kontrola)
        run: python -m py_compile "${{ steps.main.outputs.script }}"

      - name: Selftest (ffmpeg/ffprobe + analýza testovacího videa)
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc=duration=2:size=320x240:rate=25 \
            -f lavfi -i sine=duration=2 -c:v ffv1 -c:a flac -shortest test.mkv
          python "${{ steps.main.outputs.script }}" --selftest test.mkv

  build-windows:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Najdi aktuální hlavní skript
        id: main
        shell: bash
        run: |
          FILE=$(ls FFMPEG_Master_v*.pyw | sort -V | tail -n1)
          echo "Hlavní skript: $FILE"
          echo "script=$FILE" >> "$GITHUB_OUTPUT"

      - name: Build (PyInstaller)
        shell: bash
        run: |
          pyinstaller --noconfirm --onefile --windowed \
            --name FFMPEG_Master \
            --icon favicon.ico \
            --add-data "favicon.ico;." \
            --add-data "favicon.png;." \
            --collect-all tkinterdnd2 \
            --collect-all customtkinter \
            --hidden-import PIL._tkinter_finder \
            "${{ steps.main.outputs.script }}"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-exe
          path: dist/FFMPEG_Master.exe

  build-linux:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    # Záměrně připnuto na 24.04, ne ubuntu-latest: binárka poběží jen na distribucích s glibc
    # stejnou nebo novější, než má build stroj. ubuntu-latest se od 10/2026 přepíná na 26.04
    # a build z něj by na Mintu 22 / Ubuntu 24.04 nenaběhl (GLIBC_2.4x not found).
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.main.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Systémové závislosti pro Tkinter/Tk
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk-dev file

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Najdi hlavní skript a verzi
        id: main
        run: |
          FILE=$(ls FFMPEG_Master_v*.pyw | sort -V | tail -n1)
          VERSION=$(sed -n 's/^VERSION = "v\([^"]*\)".*/\1/p' "$FILE")
          echo "Hlavní skript: $FILE, verze: $VERSION"
          if [ -z "$VERSION" ]; then echo "::error::Ve skriptu $FILE nebyla nalezena VERSION"; exit 1; fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} neodpovídá VERSION ve skriptu (v${VERSION})"
            exit 1
          fi
          echo "script=$FILE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Spec soubor vyřadí z bundlu knihovny písem (fontconfig/freetype...), které se musí brát
      # ze systému - viz komentář EXCLUDE_LIBS v packaging/linux/ffmpeg-master.spec.
      - name: Build (PyInstaller)
        run: |
          pyinstaller --noconfirm packaging/linux/ffmpeg-master.spec
          chmod +x dist/ffmpeg-master

      - name: Sestav AppImage (univerzální - běží na jakékoliv distribuci)
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp dist/ffmpeg-master AppDir/usr/bin/ffmpeg-master
          cp favicon.png AppDir/usr/share/icons/hicolor/256x256/apps/ffmpeg-master.png
          cp favicon.png AppDir/ffmpeg-master.png
          cp packaging/linux/ffmpeg-master.desktop AppDir/usr/share/applications/ffmpeg-master.desktop
          cp packaging/linux/ffmpeg-master.desktop AppDir/ffmpeg-master.desktop
          cat > AppDir/AppRun << 'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/ffmpeg-master" "$@"
          EOF
          chmod +x AppDir/AppRun

          # Nový appimagetool (github.com/AppImage/appimagetool) přibalí statický runtime - hotová
          # AppImage už nepotřebuje libfuse2, kterou novější distribuce nemají v základu.
          wget -q https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage -O appimagetool.AppImage
          chmod +x appimagetool.AppImage
          # Rozbal a spusť appimagetool ručně místo přímého spuštění - runner nemusí mít FUSE.
          ./appimagetool.AppImage --appimage-extract > /dev/null
          ARCH=x86_64 ./squashfs-root/AppRun AppDir FFMPEG_Master-x86_64.AppImage
          chmod +x FFMPEG_Master-x86_64.AppImage

      - name: Nainstaluj nfpm (sestavení .deb a .rpm)
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm
          nfpm --version

      - name: Sestav .deb a .rpm
        env:
          VERSION: ${{ steps.main.outputs.version }}
        run: |
          nfpm package -f packaging/linux/nfpm.yaml -p deb -t "FFMPEG_Master_${VERSION}_amd64.deb"
          nfpm package -f packaging/linux/nfpm.yaml -p rpm -t "FFMPEG_Master-${VERSION}.x86_64.rpm"
          ls -la *.deb *.rpm *.AppImage

      - uses: actions/upload-artifact@v7
        with:
          name: linux-appimage
          path: FFMPEG_Master-x86_64.AppImage

      - uses: actions/upload-artifact@v7
        with:
          name: linux-deb
          path: FFMPEG_Master_*_amd64.deb

      - uses: actions/upload-artifact@v7
        with:
          name: linux-rpm
          path: FFMPEG_Master-*.x86_64.rpm

  # Skutečná zkouška na různých distribucích: nainstaluje .deb/.rpm přes správce balíčků (tím se
  # ověří i závislosti), spustí AppImage a v obou případech pustí `--selftest` pod virtuálním
  # X serverem s testovacím videem. Test selže, pokud:
  #   - binárka nenaběhne (chybějící/nekompatibilní knihovna),
  #   - systémový ffmpeg/ffprobe spuštěný z appky spadne (zdědil zabalené knihovny - chyba z v0.7.3
  #     na openSUSE Slowroll),
  #   - Tk/drag&drop/písma nejdou načíst, nebo se objeví "Fontconfig warning" (zabalený fontconfig
  #     nerozumí konfiguraci novějšího systému).
  test-linux:
    needs: build-linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04 (.deb + AppImage)
            image: ubuntu:24.04
            package: deb
            install: |
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y ./pkg/*.deb xvfb fonts-dejavu-core
          - name: Ubuntu 26.04 (.deb + AppImage)
            image: ubuntu:26.04
            package: deb
            install: |
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y ./pkg/*.deb xvfb fonts-dejavu-core
          - name: Debian 13 (.deb + AppImage)
            image: debian:trixie
            package: deb
            install: |
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y ./pkg/*.deb xvfb fonts-dejavu-core
          - name: Fedora (.rpm + AppImage)
            image: fedora:latest
            package: rpm
            install: |
              dnf install -y ./pkg/*.rpm xorg-x11-server-Xvfb dejavu-sans-fonts
          - name: openSUSE Tumbleweed (.rpm + AppImage)
            image: opensuse/tumbleweed
            package: rpm
            install: |
              zypper --non-interactive --gpg-auto-import-keys refresh
              zypper --non-interactive install --allow-unsigned-rpm ./pkg/*.rpm xorg-x11-server-Xvfb dejavu-fonts
          - name: Arch Linux (AppImage)
            image: archlinux:latest
            package: none
            install: |
              pacman -Syu --noconfirm ffmpeg xorg-server-xvfb fontconfig ttf-dejavu
    name: Test ${{ matrix.name }}
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: linux-*
          path: pkg
          merge-multiple: true

      - name: Nainstaluj balíček a závislosti
        shell: bash
        run: |
          set -e
          ls -la pkg
          if [ "${{ matrix.package }}" = "deb" ]; then rm -f pkg/*.rpm; fi
          if [ "${{ matrix.package }}" = "rpm" ]; then rm -f pkg/*.deb; fi
          ${{ matrix.install }}

      - name: Selftest
        shell: bash
        run: |
          set -u
          Xvfb :99 -screen 0 1280x1024x24 > /dev/null 2>&1 &
          export DISPLAY=:99
          sleep 3
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc=duration=2:size=320x240:rate=25 \
            -f lavfi -i sine=duration=2 -c:v ffv1 -c:a flac -shortest test.mkv

          failed=0
          run_selftest() {
            local label="$1"; shift
            echo "::group::$label"
            "$@" --selftest test.mkv 2> stderr.txt
            local rc=$?
            cat stderr.txt
            if grep -q "Fontconfig warning" stderr.txt; then
              echo "::error::$label: Fontconfig warning - zabalená knihovna písem nesedí se systémem"
              rc=1
            fi
            echo "::endgroup::"
            if [ $rc -ne 0 ]; then echo "::error::$label: selftest selhal (kód $rc)"; failed=1; fi
          }

          if [ "${{ matrix.package }}" != "none" ]; then
            run_selftest "Nainstalovaný .${{ matrix.package }} balíček" ffmpeg-master
          fi
          chmod +x pkg/FFMPEG_Master-x86_64.AppImage
          # Kontejner nemá FUSE - AppImage se rozbalí do /tmp a spustí odtud (chování appky je stejné).
          run_selftest "AppImage" ./pkg/FFMPEG_Master-x86_64.AppImage --appimage-extract-and-run
          exit $failed

  release:
    needs: [build-windows, build-linux, test-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-exe
          path: dist-windows

      - uses: actions/download-artifact@v8
        with:
          pattern: linux-*
          path: dist-linux
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist-windows/FFMPEG_Master.exe
            dist-linux/FFMPEG_Master-x86_64.AppImage
            dist-linux/*.deb
            dist-linux/*.rpm
